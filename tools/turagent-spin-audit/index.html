function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x&&Array.isArray(x.clients)&&x.clients.length){clients=x.clients;activeId=x.activeId||clients[0].id;return}}catch(e){}clients=[makeClient()];activeId=clients[0].id}
function save(){try{localStorage.setItem(STORE,JSON.stringify({clients,activeId}))}catch(e){console.warn('Storage unavailable',e)}}
function current(){return clients.find(c=>c.id===activeId)||clients[0]}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}
function n(x){const v=Number(x);return Number.isFinite(v)?Math.max(0,v):0}
function pct(x){return Math.min(100,Math.max(0,n(x)))/100}
function fmt(v,d=0){return new Intl.NumberFormat('uz-UZ',{maximumFractionDigits:d,minimumFractionDigits:d}).format(Number.isFinite(v)?v:0)}
function money(v){return fmt(Math.round(v))+' so‘m'}
function moneyShort(v){if(Math.abs(v)>=1e9)return fmt(v/1e9,2)+' mlrd';if(Math.abs(v)>=1e6)return fmt(v/1e6,2)+' mln';if(Math.abs(v)>=1e3)return fmt(v/1e3,0)+' ming';return fmt(v)}
function info(){const m=current().metrics||initialMetrics();const leads=n(m.leads),sales=Math.min(leads,n(m.sales)),missPct=pct(m.missPct),missed=leads*missPct,reached=Math.max(0,leads-missed),eligible=Math.max(0,reached-sales),closeRate=reached?Math.min(1,sales/reached):0,conversion=leads?sales/leads:0;const recoveredLeads=missed*pct(m.recoveryPct),recoveredSales=recoveredLeads*closeRate,extraFollowups=eligible*pct(m.followupPct),extraBookings=recoveredSales+extraFollowups,profit=n(m.profit),ticket=n(m.ticket),grossProfit=extraBookings*profit,revenue=extraBookings*ticket,workHours=n(m.staff)*n(m.hours)*n(m.days)*pct(m.timeSavingPct),timeValue=workHours*n(m.hourCost),fee=n(m.crmFee),setup=n(m.setup),netCash=grossProfit-fee,roi=fee?netCash/fee*100:null,firstMonthNet=netCash-setup,payback=(grossProfit>fee&&setup>0)?setup/(grossProfit-fee):null;return{leads,sales,missed,reached,eligible,closeRate,conversion,recoveredLeads,recoveredSales,extraFollowups,extraBookings,grossProfit,revenue,workHours,timeValue,fee,setup,netCash,roi,firstMonthNet,payback,hasData:leads>0&&profit>0,invalidSales:n(m.sales)>reached,missingProfit:profit===0}}
function statsAnswered(){const a=current().answers||{};return questions.filter(q=>a[q.id]&&(a[q.id].status||a[q.id].note)).length}
function problems(){const a=current().answers||{};return questions.filter(q=>q.phase==='P'&&a[q.id]&&a[q.id].status==='problem')}
function priorities(){const ps=problems();const s=ps.map(q=>q.title);const suggestions=[];if(s.some(x=>/javobsiz|kech/.test(x)))suggestions.push({title:'Murojaatlarni yo‘qotmaslik',why:'Kanallar bo‘yicha kelgan lidlarning mas’uli, statusi va birinchi javob vaqtini kuzatish.',test:'Sinovda javobsiz lidlar ulushini o‘lchang.'});if(s.some(x=>/qayta|follow-up|Bekor/.test(x)))suggestions.push({title:'Follow-up intizomi',why:'Har bir ochiq so‘rov uchun keyingi aloqa sanasi va bajarilish nazoratini joriy qilish.',test:'Muddati o‘tgan vazifalar sonini o‘lchang.'});if(s.some(x=>/tarix|ikki menejer|ketganida/.test(x)))suggestions.push({title:'Yagona mijoz tarixi',why:'Mijoz, mas’ul shaxs va o‘zaro aloqa yozuvlarini markazlashgan tartibda yuritish.',test:'Mijoz tarixini topishga ketgan vaqtni solishtiring.'});if(s.some(x=>/Reklama|Rahbar|natija/.test(x)))suggestions.push({title:'Rahbar uchun analitika',why:'Lead manbasi, menejer, bosqich va sotuv bo‘yicha muntazam hisobot.',test:'Kunlik hisobot tayyorlash vaqtini o‘lchang.'});if(s.some(x=>/to‘lov|bron|qoldiq/.test(x)))suggestions.push({title:'Bron va to‘lov nazorati',why:'Bron statuslari va to‘lov muddatlarini yagona ish jarayoniga bog‘lash.',test:'Kechikkan to‘lov bo‘yicha eslatmalarni sinang; kerakli integratsiyalarni tekshiring.'});return suggestions.length?suggestions:[{title:'Avval asosiy muammoni aniqlang',why:'Problem bosqichida rahbar tasdiqlagan muammolarni belgilang. Hozir aniq tashxis uchun dalil yetarli emas.',test:'1–2 ta muammoni misol va raqam bilan tasdiqlang.'}]}

<div class="panel"><h2 class="panel-title">02. Tavsiya qilinadigan yo‘nalishlar</h2><p class="panel-sub">Bu CRM imkoniyati haqidagi qat'iy va'da emas, aniqlangan muammoga mos tekshirish rejasi.</p>${pr.map((r,i)=>`<div class="rec"><h4>${i+1}. ${esc(r.title)}</h4><p>${esc(r.why)}</p><em>30 kunlik sinov: ${esc(r.test)}</em></div>`).join('')}</div></div>
<div class="section-head"><h2>03. Moliyaviy imkoniyat ssenariysi</h2><span>Oylik, taxminiy</span></div><div class="grid four">${stat('Tiklangan lidlardan bron',o.hasData?fmt(o.recoveredSales,1):'—','Javobsiz guruh')}${stat('Follow-up dan bron',o.hasData?fmt(o.extraFollowups,1):'—','Ilgari kontaktdagi sotilmaganlar')}${stat('Qo‘shimcha foyda',o.hasData?money(o.grossProfit):'—','Oyiga, kafolat emas','positive')}${stat('CRMdan keyingi oylik foyda',o.hasData?money(o.netCash):'—','Faqat foyda hissasi − tarif','positive')}</div>
<div class="grid two" style="margin-top:17px"><div class="panel"><h2 class="panel-title">Pul oqimi ko‘rsatkichlari</h2><div class="breakdown"><div class="breakrow"><span>Potensial qo‘shimcha tushum</span><strong>${money(o.revenue)}</strong></div><div class="breakrow"><span>Qo‘shimcha foyda hissasi</span><strong>${money(o.grossProfit)}</strong></div><div class="breakrow"><span>Oylik CRM to‘lovi</span><strong>${money(o.fee)}</strong></div><div class="breakrow"><span>Joriy etish xarajati</span><strong>${money(o.setup)}</strong></div><div class="breakrow"><span>Birinchi oy hisobiy net natija</span><strong>${money(o.firstMonthNet)}</strong></div><div class="breakrow"><span>Oylik ROI</span><strong>${o.roi===null?'Tarif yo‘q':fmt(o.roi,1)+'%'}</strong></div><div class="breakrow"><span>Setup xarajati qoplanishi</span><strong>${o.setup===0?'Setup yo‘q':o.payback!==null?fmt(o.payback,1)+' oy':'Bu ssenariyda qoplanmaydi'}</strong></div></div></div><div class="panel"><h2 class="panel-title">Vaqt va ssenariy farazlari</h2><div class="breakdown"><div class="breakrow"><span>Javobsiz so‘rovlarning tiklanishi</span><strong>${fmt(pct(c.metrics.recoveryPct)*100,1)}%</strong></div><div class="breakrow"><span>Follow-up orqali qo‘shimcha sotuv</span><strong>${fmt(pct(c.metrics.followupPct)*100,1)}%</strong></div><div class="breakrow"><span>Mehnat vaqti qisqarishi</span><strong>${fmt(pct(c.metrics.timeSavingPct)*100,1)}%</strong></div><div class="breakrow"><span>Bo‘shashi mumkin bo‘lgan vaqt</span><strong>${fmt(o.workHours,1)} soat / oy</strong></div><div class="breakrow"><span>Vaqtning hisobiy qiymati</span><strong>${money(o.timeValue)}</strong></div></div><div class="formula">Vaqt qiymati naqd tejalish sifatida yoki ROI ichida hisoblanmadi. Barcha yaxshilanish foizlari suhbatdagi faraz bo‘lib, sinovda tekshirilishi kerak.</div></div></div>
<div class="panel" style="margin-top:17px"><h2 class="panel-title">04. Rahbar bilan kelishiladigan keyingi qadam</h2><div class="grid three"><div class="insight green"><b>1. Bazaviy nuqtani o‘lchash</b><div>7 kun: yangi so‘rov, javob tezligi, follow-up va bronlar.</div></div><div class="insight green"><b>2. Kichik sinov</b><div>30 kun: 1–2 menejer bilan jarayon va mos funksiyalarni sinash.</div></div><div class="insight green"><b>3. Natijani taqqoslash</b><div>Konversiya, qolib ketgan vazifalar va vaqt sarfini boshlang‘ich holat bilan solishtirish.</div></div></div><p style="font-size:13px;line-height:1.7;margin-bottom:0"><b>Uchrashuvni yakunlash uchun savol:</b> “Shu uchta ko‘rsatkichdan qaysi biri yaxshilansa, tizimni joriy qilishga asos bo‘ladi? Sinov natijasini qaysi sanada birga ko‘ramiz?”</p></div>
<div class="panel" style="margin-top:17px"><h2 class="panel-title">05. Suhbatdan olingan qo‘shimcha dalillar</h2>${phases.map(ph=>{const aa=questions.filter(q=>q.phase===ph.id && answers[q.id]&&(answers[q.id].note||answers[q.id].status));if(!aa.length)return '';return `<h3 style="font-size:13px;margin:16px 0 8px">${ph.name} — ${ph.uz}</h3>${aa.map(q=>`<div style="font-size:12px;line-height:1.7;border-bottom:1px dashed #e6eaf0;padding:9px 0"><b>${esc(q.title)}</b><div class="muted">${esc(answers[q.id]?.note||(['problem'].includes(answers[q.id]?.status)?'Muammo borligi belgilangan':'Holat qayd etilgan'))}</div></div>`).join('')}`}).join('')||'<p class="muted">Hali qayd yo‘q.</p>'}</div>
<div class="alert" style="margin-top:20px"><b>Hisob chegarasi:</b> Hisobotdagi qo‘shimcha sotuv va foyda kafolatlanmaydi. Bir sotuvning foyda hissasi haqiqiy xarajatlar bo‘yicha hisoblanishi lozim. CRM dasturi aynan qanday avtomatlashtirish va integratsiyalarni qo‘llashi joriy etishdan oldin tekshiriladi. Agar aniqlangan foizlar taxminiy bo‘lsa, mijozga ularni shunday ko‘rsating.</div><div class="actionsline no-print"><button class="btn" onclick="setView('spin')">← SPIN javoblari</button><button class="btn primary" onclick="window.print()">⎙ PDFga saqlash</button></div>`}
function render(){if(!current()){clients=[makeClient()];activeId=clients[0].id}const names={home:'Bosh sahifa',spin:'SPIN suhbat',calc:'Kalkulyator',report:'Yakuniy hisobot'};document.getElementById('crumb').textContent=names[view];document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.getElementById('app').innerHTML=({home,spin,calc,report}[view]||home)();bind()}
function bind(){const app=document.getElementById('app');app.querySelectorAll('[data-client]').forEach(el=>el.addEventListener('input',e=>{current()[e.target.dataset.client]=e.target.value;save();if(e.target.dataset.client==='name'){const node=app.querySelector('.client-item.active button');if(node)node.childNodes[0].textContent=e.target.value||'Nomsiz agentlik'}}));app.querySelectorAll('[data-metric]').forEach(el=>el.addEventListener('change',e=>{const m=current().metrics||(current().metrics=initialMetrics());m[e.target.dataset.metric]=e.target.value;save();const id=e.target.id,focusPos=e.target.selectionStart;render();const field=document.getElementById(id);if(field){field.focus();try{field.setSelectionRange(focusPos,focusPos)}catch(err){}}}));app.querySelectorAll('[data-answer-note]').forEach(el=>el.addEventListener('input',e=>{const id=e.target.dataset.answerNote;current().answers ||= {};current().answers[id] ||= {};current().answers[id].note=e.target.value;save()}));app.querySelectorAll('[data-answer-status]').forEach(el=>el.addEventListener('change',e=>{const id=e.target.dataset.answerStatus;current().answers ||= {};current().answers[id] ||= {};current().answers[id].status=e.target.value;save()}));app.querySelectorAll('[data-phase]').forEach(el=>el.addEventListener('click',()=>{view='spin';setPhase(el.dataset.phase)}));app.querySelectorAll('[data-switch]').forEach(el=>el.addEventListener('click',()=>{activeId=el.dataset.switch;save();render()}));app.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.delete;if(!confirm('Ushbu agentlik auditi butunlay o‘chirilsinmi?'))return;clients=clients.filter(x=>x.id!==id);if(activeId===id)activeId=clients[0].id;save();render()}));const nbtn=document.getElementById('newClient');if(nbtn)nbtn.onclick=()=>{const name=prompt('Yangi agentlik nomi:','Yangi turagentlik');if(name===null)return;const c=makeClient(name.trim()||'Yangi turagentlik');clients.unshift(c);activeId=c.id;save();render()};const importBtn=document.getElementById('importInput');if(importBtn)importBtn.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>1000000)throw Error('Fayl 1 MB dan katta');const obj=JSON.parse(await f.text());if(!Array.isArray(obj.clients)||!obj.clients.length||obj.clients.length>300||!obj.clients.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string'))throw Error('JSON formati mos emas');if(!confirm('Hozirgi saqlangan agentliklar importdagilar bilan almashtirilsinmi?'))return;clients=obj.clients;activeId=clients.find(x=>x.id===obj.activeId)?.id||clients[0].id;save();render()}catch(err){alert('Import xatosi: '+err.message)}})}
const demo={leads:600,sales:48,missPct:15,ticket:8000000,profit:650000,recoveryPct:40,followupPct:1.5,staff:5,hours:1.2,days:22,hourCost:45000,timeSavingPct:40,crmFee:1200000,setup:0};
function download(content,file,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function init(){load();save();document.querySelectorAll('#nav button').forEach(el=>el.onclick=()=>setView(el.dataset.view));document.getElementById('demoBtn').onclick=()=>{if(!confirm('Joriy agentlikdagi kalkulyator ko‘rsatkichlari namuna raqamlari bilan almashtirilsinmi?'))return;current().metrics={...demo};save();setView('calc')};document.getElementById('exportBtn').onclick=()=>download(JSON.stringify({version:1,exportedAt:new Date().toISOString(),clients,activeId},null,2),'toursales-audit-backup.json','application/json;charset=utf-8');document.getElementById('printBtn').onclick=()=>{setView('report');setTimeout(()=>window.print(),120)};render()}
init();
</script>
</body></html>
