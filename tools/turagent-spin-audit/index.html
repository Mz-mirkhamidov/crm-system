/* === Consultation / presentation upgrade === */
.confidential{border-radius:12px;border:1px solid #ead6a8;background:#fffaf1;color:#86652e;padding:15px 18px;line-height:1.65;margin:0 0 18px;font-size:12px}
.interviewer{margin-bottom:16px;background:linear-gradient(110deg,#fff,#f6fcfa)}
.interviewer h2{font-size:17px;line-height:1.6;max-width:900px;margin:5px 0 15px}
.scriptquote{font-size:15px;background:#f0faf8;color:#23695d;padding:17px;border-left:4px solid var(--teal);border-radius:0 10px 10px 0;line-height:1.6;margin:0}
.interview-actions{margin-top:17px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.question-tags{margin-bottom:8px}
.inline-metric{padding:12px 14px;background:#f3f8fb;border:1px solid #e3eaf2;border-radius:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.inline-metric label{font-size:12px;font-weight:700}
.inline-metric input{border:1px solid #cbd7e0;background:#fff;border-radius:9px;padding:10px;width:138px}
.inline-metric small{color:var(--muted);font-size:11px}
.calc-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:20px}
.calc-step{text-align:left;background:#fff;border:1px solid var(--border);border-radius:13px;padding:14px;display:flex;align-items:center;gap:11px;color:var(--ink)}
.calc-step span{width:30px;height:30px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;background:#f0f4f8;color:#637488;font-size:12px;font-weight:900}
.calc-step strong{font-size:12px;line-height:1.35}
.calc-step.active{border-color:#0d9887;background:#eaf8f5}
.calc-step.active span{background:var(--teal);color:#fff}
.calc-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:18px;align-items:start}
.calc-layout .panel .inline-note{margin-top:21px}
.step-kicker{color:var(--teal);font-size:11px;letter-spacing:1.2px;font-weight:850;margin-bottom:12px}
.live-panel{position:sticky;top:98px}
.live-top{display:flex;align-items:start;justify-content:space-between;gap:12px}
.live-top h2{font-size:18px;margin:0 0 15px}
.live-stats{margin:6px 0 15px}
.live-stats .stat{padding:15px}
.live-stats .stat .v{font-size:20px;overflow-wrap:anywhere}
.live-stats .stat .k{margin-bottom:5px}
.scenario-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scenario{min-width:0;border:1px solid var(--border);padding:12px 10px;border-radius:10px;background:#f9fafc;overflow-wrap:anywhere}
.scenario small{display:block;color:var(--muted);font-size:10px;margin-bottom:8px}
.scenario b{font-size:12px}
.scenario.active{border-color:var(--teal);background:var(--tealbg)}
.presenting{background:#f7f9fd}
.presenting .sidebar,.presenting .topbar{display:none!important}
.presenting .main{margin:0;width:100%}
.presenting .content{max-width:1440px;padding:20px 32px 32px}
.present-wrap{min-height:calc(100vh - 60px)}
.present-toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:8px 0 24px}
.present-brand{display:flex;align-items:center;gap:9px;font-size:14px;color:#647185}
.present-brand strong{color:#18243b}
.present-symbol{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--teal);color:#fff;font-weight:900;font-size:19px}
.present-controls{display:flex;gap:8px}
.present-area{max-width:1320px;margin:auto}
.present-slide{display:none;min-height:calc(100vh - 190px)}
.present-slide.selected{display:block}
.present-slide h1{font-size:clamp(29px,3.2vw,47px);line-height:1.13;letter-spacing:-1.5px;margin:12px 0 16px}
.present-intro{color:var(--muted);font-size:17px;line-height:1.7;margin:0 0 27px;max-width:800px}
.present-hero{border-radius:24px;background:linear-gradient(120deg,#132139,#143b4c);min-height:430px;color:#fff;padding:clamp(30px,5vw,74px);display:flex;align-items:flex-start;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.present-hero:after{content:"";position:absolute;right:-110px;top:-190px;width:490px;height:490px;border-radius:50%;background:#189c8d1c;border:1px solid #2dd9c455}
.present-hero h1{font-size:clamp(38px,5vw,68px);max-width:880px;position:relative;z-index:1}
.present-hero h1 span{color:#7ddccf}
.present-hero .eyebrow{color:#7ddccf;position:relative;z-index:1}
.present-hero p{color:#b4c7ce;font-size:18px;line-height:1.7;max-width:690px;margin:8px 0}
.present-date{color:#b4d0cb;margin-top:22px}
.present-mini{border-radius:15px;background:#fff;border:1px solid var(--border);padding:25px}
.present-mini span{display:block;color:var(--teal);font-weight:900;font-size:22px;margin-bottom:12px}
.present-mini b{font-size:17px}
.present-mini p{color:var(--muted);margin:8px 0 0}
.public-flow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}
.public-flow>div{background:#f2f8f7;border-radius:14px;flex:1;text-align:center;padding:24px 10px}
.public-flow strong{display:block;font-size:29px;font-weight:850;color:#17384d}
.public-flow span:not(.flow-arrow){color:var(--muted);display:block;font-size:13px;margin-top:8px}
.flow-arrow{font-size:25px;color:#87a6a1}
.public-breakdown{margin-top:24px}
.present-footnote{color:var(--muted);font-size:12px;margin-top:20px}
.plan-card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:25px;line-height:1.6}
.plan-card span{font-size:23px;color:var(--teal);font-weight:900}
.plan-card h2{font-size:17px;margin:15px 0 8px}
.plan-card p{color:var(--muted);margin:0}
.public-priority{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid var(--border)}
.public-priority:last-child{border:0}
.public-priority span{color:var(--muted);max-width:65%;text-align:right}
.public-cta{margin-top:28px;background:var(--navy);border-radius:16px;color:white;text-align:center;font-size:23px;font-weight:800;padding:29px 18px}
.present-pagination{display:flex;align-items:center;justify-content:center;gap:22px;margin:24px auto 4px}
.present-pagination>span{color:var(--muted);font-size:12px;font-weight:700}
.slide-dots{display:flex;gap:9px;align-items:center}
.slide-dots button{border:0;background:#c4cfd7;width:9px;height:9px;border-radius:99px;padding:0}
.slide-dots button.active{width:28px;background:var(--teal)}
@media(max-width:1150px){.calc-layout{grid-template-columns:1fr}.live-panel{position:static}}

function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x&&Array.isArray(x.clients)&&x.clients.length){clients=x.clients;activeId=x.activeId||clients[0].id;return}}catch(e){}clients=[makeClient()];activeId=clients[0].id}

function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}
function n(x){const v=Number(x);return Number.isFinite(v)?Math.max(0,v):0}
function pct(x){return Math.min(100,Math.max(0,n(x)))/100}
function fmt(v,d=0){return new Intl.NumberFormat('uz-UZ',{maximumFractionDigits:d,minimumFractionDigits:d}).format(Number.isFinite(v)?v:0)}
function money(v){return fmt(Math.round(v))+' so‘m'}
function moneyShort(v){if(Math.abs(v)>=1e9)return fmt(v/1e9,2)+' mlrd';if(Math.abs(v)>=1e6)return fmt(v/1e6,2)+' mln';if(Math.abs(v)>=1e3)return fmt(v/1e3,0)+' ming';return fmt(v)}
function info(factor=1){
  const m=current().metrics||initialMetrics();
  const filled=k=>m[k]!==''&&m[k]!==undefined&&m[k]!==null;
  const leads=n(m.leads),rawSales=n(m.sales),sales=Math.min(rawSales,leads);
  const manualMiss=filled('missedCount');
  const rawMiss=manualMiss?n(m.missedCount):leads*pct(m.missPct);
  const missed=Math.min(rawMiss,leads),missPct=leads?missed/leads:0;
  const reached=Math.max(0,leads-missed),eligible=Math.max(0,reached-sales);
  const closeRate=reached?Math.min(1,sales/reached):0,conversion=leads?sales/leads:0;
  const recoveredLeads=missed*Math.min(1,pct(m.recoveryPct)*factor);
  const recoveredSales=recoveredLeads*Math.min(1,pct(m.recoveryClosePct)*factor);
  const extraFollowups=eligible*Math.min(1,pct(m.followupPct)*factor);
  const extraBookings=recoveredSales+extraFollowups;
  const profit=n(m.profit),ticket=n(m.ticket);
  const grossProfit=extraBookings*profit,revenue=extraBookings*ticket;
  const workHours=n(m.staff)*n(m.hours)*n(m.days)*pct(m.timeSavingPct);
  const timeValue=workHours*n(m.hourCost),fee=n(m.crmFee),setup=n(m.setup),netCash=grossProfit-fee;
  const roi=filled('crmFee')&&fee>0?netCash/fee*100:null;
  const firstMonthNet=netCash-setup;
  const payback=netCash>0&&setup>0?setup/netCash:null;
  const invalidSales=filled('sales')&&rawSales>reached;
  const invalidMissed=manualMiss&&rawMiss>leads;
  const invalidProfit=filled('ticket')&&ticket>0&&profit>ticket;
  const invalidRates=['missPct','recoveryPct','recoveryClosePct','followupPct','timeSavingPct'].some(k=>filled(k)&&(Number(m[k])<0||Number(m[k])>100));
  const valid=!invalidSales&&!invalidMissed&&!invalidProfit&&!invalidRates;
  const hasBaseData=filled('leads')&&leads>0&&filled('sales')&&(manualMiss||filled('missPct'))&&filled('profit')&&profit>0;
  const hasAssumptions=filled('recoveryPct')&&filled('recoveryClosePct')&&filled('followupPct');
  const hasData=hasBaseData&&hasAssumptions&&valid;
  const hasFee=filled('crmFee');
  return {leads,sales,missed,missPct,reached,eligible,closeRate,conversion,recoveredLeads,recoveredSales,extraFollowups,extraBookings,grossProfit,revenue,workHours,timeValue,fee,setup,netCash,roi,firstMonthNet,payback,invalidSales,invalidMissed,invalidProfit,invalidRates,hasFee,hasBaseData,hasAssumptions,hasData,valid,missingProfit:!filled('profit')||!profit};
}

function spin(){
 const c=current(),p=phases.find(x=>x.id===phase),done=statsAnswered();
 const qlist=order[phase].map(id=>questions.find(x=>x.id===id)).filter(Boolean);
 const items=extended?qlist:qlist.filter(q=>essential[phase].includes(q.id));
 const metricByQuestion={S1:{key:'leads',label:'So‘rovlar / oy'},S4:{key:'staff',label:'Sotuv menejerlari'},P1:{key:'missedCount',label:'Javobsiz lidlar / oy'},I1:{key:'profit',label:'Bir bron foydasi (so‘m)'},I4:{key:'hours',label:'Bir menejer vaqt sarfi (soat/kun)'}};
 const prompts={S:'“Avval ish tartibingizni tushunib olay. Sizda mijoz birinchi yozganidan to bron qilgungacha nima bo‘ladi?”',P:'“Shu jarayonda eng ko‘p qaysi joyda mijoz yoki vaqt yo‘qotiladi?”',I:'“Bu holatlar bir oyda takrorlansa, sotuv yoki xarajatga qanday ta’sir qiladi?”',N:'“Agar shu muammoni o‘lchab kamaytirsak, siz uchun natija nima bo‘ladi?”'};
 return header('Uchrashuv skripti · faqat siz uchun','Rahbar bilan tabiiy suhbat o‘tkazing: avval fakt, keyin muammo, oqibat va yechim qiymati.',`<button class="btn primary" onclick="openPresentation()">▣ Rahbarga taqdimot →</button>`)+
 `<div class="confidential">🔒 <strong>ICHKI REJIM:</strong> Bu savollar, eslatmalar va rahbarning shaxsiy javoblari taqdimotda ko‘rsatilmaydi. Ekran ulashishdan oldin “Rahbarga taqdimot” tugmasini bosing.</div>`+
 `<div class="phase-tabs">${phases.map(x=>`<button class="btn ${x.id===phase?'selected':''}" data-phase="${x.id}">${x.id} · ${x.uz}</button>`).join('')}</div>`+
 `<div class="panel interviewer"><span class="eyebrow">${p.name} · ${p.uz}</span><h2>${p.desc}</h2><p class="scriptquote">${prompts[phase]}</p><div class="interview-actions"><span class="pill grey">${done}/${questions.length} qayd</span><button class="btn sm" onclick="toggleExtended()">${extended?'− Qo‘shimcha savollarni yashirish':'+ Barcha savollar ('+qlist.length+')'}</button></div></div>`+

 `<div class="actionsline"><button class="btn" onclick="setPhase('${phases[Math.max(0,phases.findIndex(x=>x.id===phase)-1)].id}')" ${phase==='S'?'disabled':''}>← Oldingi</button>${phase==='N'?`<button class="btn primary" onclick="setView('calc')">Raqamli hisobga o‘tish →</button>`:`<button class="btn primary" onclick="setPhase('${phases[phases.findIndex(x=>x.id===phase)+1].id}')">Keyingi suhbat qismi →</button>`}</div>`;

 const layout=[
 `<div class="panel"><div class="step-kicker">01 · RAQAM BILAN BOSHLANG</div><h2 class="panel-title">Bir oyda agentlik qanday ishlaydi?</h2><p class="panel-sub">Rahbar bergan faktlarni kiriting. Misol raqamlarini fakt bilan aralashtirmang.</p><div class="form-grid two-col">${number('leads','Yangi so‘rovlar / oy','Masalan: 600','Jami takrorlanmagan murojaatlar')}${number('sales','Sotilgan tur / bron / oy','Masalan: 48','Aynan shu davrdagi bronlar')}${number('profit','1 bronning foyda hissasi, so‘m','Masalan: 650000','Tushum − to‘g‘ridan-to‘g‘ri tur xarajatlari')}${number('ticket','1 bronning sotuv narxi, so‘m (ixtiyoriy)','Masalan: 8000000','Faqat tushumni alohida ko‘rsatish uchun')}</div><div class="inline-note">Suhbat savoli: “O‘tgan oy qancha murojaat keldi, ulardan nechtasi haqiqiy bron bo‘ldi va bitta bron biznesga o‘rtacha qancha foyda qoldiradi?”</div></div>`,
 `<div class="panel"><div class="step-kicker">02 · MUAMMONI SONDA BILISH</div><h2 class="panel-title">Murojaatlarning qanchasi ishlanmay qoladi?</h2><p class="panel-sub">Javob berilmagan lidlar alohida guruh. Aloqa qilingan, ammo sotilmagan lidlar esa follow-up uchun asos.</p><div class="form-grid two-col">${number('missedCount','Javobsiz qolgan so‘rovlar / oy','Masalan: 90','Aniq son ma’lum bo‘lsa, shuni kiriting')}${number('missPct','Yoki javobsiz so‘rovlar foizi (%)','Masalan: 15','Aniq son kiritilgan bo‘lsa, foiz ishlatilmaydi')}</div><div class="breakdown" style="margin-top:21px"><div class="breakrow"><span>Javob berilgan murojaatlar</span><strong>${o.hasBaseData?fmt(o.reached,1):'—'}</strong></div><div class="breakrow"><span>Javob berilgan, ammo bron qilmaganlar</span><strong>${o.hasBaseData?fmt(o.eligible,1):'—'}</strong></div><div class="breakrow"><span>Hozirgi umumiy konversiya</span><strong>${o.leads?fmt(o.conversion*100,1)+'%':'—'}</strong></div></div><div class="inline-note">Suhbat savoli: “Birinchi javob kechikishi va qayta aloqa qilinmagani sabab aynan qayerda mijozlarni yo‘qotyapsiz?”</div></div>`,
 `<div class="panel"><div class="step-kicker">03 · FARAZLARNI OCHIQ KIRITING</div><h2 class="panel-title">Jarayon yaxshilansa nima o‘zgarishi mumkin?</h2><p class="panel-sub">Bu raqamlar hali erishilgan natija emas. 7–30 kunlik sinovda tekshirish uchun qo‘yilgan taxminlar.</p><div class="form-grid two-col">${number('recoveryPct','Javobsiz lidlarning qanchasiga qayta chiqamiz? (%)','Masalan: 40','Qayta bog‘lanish ulushi')}${number('recoveryClosePct','Qayta bog‘langanlarning necha foizi bron qiladi? (%)','Masalan: 8','Alohida konversiya taxmini, avtomatik olinmaydi')}${number('followupPct','Aloqaga chiqqan, sotilmaganlardan nechta % qo‘shimcha bron bo‘ladi?','Masalan: 1.5','Bu guruh javobsiz lidlarga qo‘shilmaydi')}</div><div class="formula">1) Tiklangan bron = javobsiz lidlar × qayta bog‘lanish % × qayta bog‘langanlardan sotuv %. 2) Follow-up bron = (javob berilgan − mavjud bronlar) × qo‘shimcha sotuv %. 3) Jami qo‘shimcha bron = ushbu ikki alohida guruh yig‘indisi.</div></div>`,
 `<div class="panel"><div class="step-kicker">04 · INVESTITSIYA VA TEKSHIRUV</div><h2 class="panel-title">Tizimning qiymati xarajatni qoplaydimi?</h2><p class="panel-sub">CRM tarifini va bir martalik ishga tushirish sarfini tasdiqlangan narx bilan to‘ldiring.</p><div class="form-grid two-col">${number('crmFee','Oylik CRM xarajati, so‘m','Masalan: 1200000')}${number('setup','Bir martalik sozlash, so‘m','Masalan: 0')}${number('staff','Sotuv menejerlari soni','Masalan: 5')}${number('hours','Bir menejer kuniga qo‘lda sarflaydigan vaqt (soat)','Masalan: 1.2')}${number('days','Oylik ish kunlari','Masalan: 22')}${number('timeSavingPct','Vaqt qisqarishi farazi (%)','Masalan: 40')}${number('hourCost','Bir soat mehnat qiymati, so‘m','Masalan: 45000')}</div><div class="breakdown" style="margin-top:25px"><div class="breakrow"><span>Oylik qo‘shimcha foyda hissasi</span><strong>${o.hasData?money(o.grossProfit):'—'}</strong></div><div class="breakrow"><span>CRM xarajatidan keyin</span><strong>${o.hasData&&m.crmFee!==''?money(o.netCash):'—'}</strong></div><div class="breakrow"><span>Birinchi oy natijasi (sozlash bilan)</span><strong>${o.hasData&&m.crmFee!==''&&m.setup!==''?money(o.firstMonthNet):'—'}</strong></div><div class="breakrow"><span>Hisobiy setup qoplash muddati</span><strong>${o.hasData&&m.crmFee!==''&&m.setup!==''?(o.setup===0?'Bir martalik xarajat yo‘q':o.payback?fmt(o.payback,1)+' oy':'Bu ssenariyda qoplanmaydi'):'—'}</strong></div></div><div class="formula">“Foyda” — bron uchun qoladigan foyda hissasi. Tejalishi mumkin bo‘lgan vaqt naqd foydaga va ROIga qo‘shilmaydi. Barcha foizlar pilot natijasida qayta o‘lchanadi.</div></div>`
 ];
 return header('Raqamli biznes diagnostika','Muloqotdagi ketma-ketlik: real sotuv → yo‘qotish → tekshiriladigan yaxshilanish → investitsiya.',`<button class="btn primary" onclick="openPresentation()">▣ Rahbarga ko‘rsatish →</button>`)+
 `<div class="calc-tabs">${calcStages.map((x,i)=>`<button type="button" class="calc-step ${calcStep===i?'active':''}" onclick="setCalcStep(${i})"><span>${x.icon}</span><strong>${x.title}</strong></button>`).join('')}</div>`+
 `<div class="calc-layout"><div>${layout[calcStep]}<div class="actionsline"><button class="btn" onclick="setCalcStep(${calcStep-1})" ${calcStep===0?'disabled':''}>← Oldingi</button>${calcStep===3?'<button class="btn primary" onclick="openPresentation()">Taqdimotga o‘tish →</button>':`<button class="btn primary" onclick="setCalcStep(${calcStep+1})">Keyingi: ${calcStages[calcStep+1].title} →</button>`}</div></div><div id="liveCalc" class="panel live-panel">${calcLive()}</div></div>`;
}

function present(){
 const c=current(),o=info(),has=o.hasData,rec=priorities().filter(x=>x.title!=='Avval asosiy muammoni aniqlang').slice(0,3);
 const slideOne=`<section class="present-slide ${presentSlide===0?'selected':''}"><div class="present-hero"><span class="eyebrow">TURAGENTLIK · BIZNES DIAGNOSTIKA</span><h1>${esc(c.name||'Turagentlik')}<br><span>savdolar rivojlanish rejasi</span></h1><p>Jarayonni o‘lchaymiz. Imkoniyatni raqamda ko‘ramiz. Natijani sinov bilan tekshiramiz.</p><div class="present-date">${esc(c.date||'')}</div></div><div class="grid three" style="margin-top:26px"><div class="present-mini"><span>1</span><b>Hozirgi holat</b><p>So‘rov va bron oqimi</p></div><div class="present-mini"><span>2</span><b>O‘sish imkoniyati</b><p>Yo‘qotilgan murojaatlar</p></div><div class="present-mini"><span>3</span><b>Amaliy reja</b><p>Natijani o‘lchash</p></div></div></section>`;
 const slideTwo=`<section class="present-slide ${presentSlide===1?'selected':''}"><div class="eyebrow">01 / HOZIRGI HOLAT</div><h1>Bugungi savdo voronkasi</h1><p class="present-intro">Bir davrning aniq raqamlarini solishtiramiz. Bu ko‘rsatkichlar rahbar bilan tekshiriladi.</p><div class="grid four">${stat('Murojaatlar / oy',o.hasBaseData?fmt(o.leads):'—','Jami so‘rov')}${stat('Amaldagi bron',o.hasBaseData?fmt(o.sales):'—','Sotilgan turlar')}${stat('Javobsiz so‘rov',o.hasBaseData?fmt(o.missed,1):'—','Qayta ko‘rib chiqiladigan guruh','negative')}${stat('Amaldagi konversiya',o.hasBaseData?fmt(o.conversion*100,1)+'%':'—','Bron / murojaat')}</div><div class="panel" style="margin-top:25px"><h2>Murojaat qayerda to‘xtab qolmoqda?</h2><div class="public-flow"><div><strong>${o.hasBaseData?fmt(o.leads):'—'}</strong><span>Kelgan so‘rov</span></div><span class="flow-arrow">→</span><div><strong>${o.hasBaseData?fmt(o.reached,1):'—'}</strong><span>Javob berilgan</span></div><span class="flow-arrow">→</span><div><strong>${o.hasBaseData?fmt(o.sales):'—'}</strong><span>Sotuvga aylangan</span></div></div></div></section>`;
 const slideThree=`<section class="present-slide ${presentSlide===2?'selected':''}"><div class="eyebrow">02 / O‘SISH IMKONIYATI</div><h1>Sotuv imkoniyatining puldagi ifodasi</h1><p class="present-intro">Quyidagi natija maqsadli ssenariy, amalga oshgan daromad emas. Foizlar sinovda tasdiqlanadi.</p>${has?`<div class="grid three">${stat('Qo‘shimcha bronlar',fmt(o.extraBookings,1)+' ta','Oyiga, taxmin')}${stat('Qo‘shimcha foyda hissasi',money(o.grossProfit),'Oyiga, taxmin','positive')}${stat('CRMdan keyingi natija',o.hasFee?money(o.netCash):'—','Tarif kiritilgach ko‘rinadi','positive')}</div><div class="panel public-breakdown"><h2>Natijaga nima ta’sir qiladi?</h2><div class="breakdown"><div class="breakrow"><span>Javobsiz so‘rovlardan qo‘shimcha bron</span><strong>${fmt(o.recoveredSales,1)} ta</strong></div><div class="breakrow"><span>Qayta aloqa orqali qo‘shimcha bron</span><strong>${fmt(o.extraFollowups,1)} ta</strong></div><div class="breakrow"><span>CRM oylik xarajati</span><strong>${current().metrics.crmFee===''?'Hali aniqlanmagan':money(o.fee)}</strong></div></div></div>`:`<div class="empty"><strong>Hisob uchun ma’lumot yig‘ilmoqda</strong>So‘rovlar, sotuv, javobsiz holatlar, foyda hissasi va yaxshilanish taxminlarini to‘ldirgach natija paydo bo‘ladi.</div>`}<div class="present-footnote">Hisobiy qiymat: moliyaviy kafolat emas. Vaqt tejalishi foydaga qo‘shilmagan.</div></section>`;
 const slideFour=`<section class="present-slide ${presentSlide===3?'selected':''}"><div class="eyebrow">03 / KEYINGI QADAM</div><h1>30 kunlik amaliy sinov rejasi</h1><p class="present-intro">Vazifa — qaysi imkoniyat qancha qiymat berishini taxmin bilan emas, real o‘lchov bilan tasdiqlash.</p><div class="grid three"><div class="plan-card"><span>01</span><h2>7 kun · holatni o‘lchash</h2><p>Murojaat soni, javob tezligi, sotuv va bajarilgan follow-up bazasi.</p></div><div class="plan-card"><span>02</span><h2>14 kun · kichik joriy etish</h2><p>1–2 menejer bilan ish jarayonini sinash va mas’ullarni belgilash.</p></div><div class="plan-card"><span>03</span><h2>30 kun · natijani solishtirish</h2><p>Yo‘qotilgan lid, konversiya va nazoratdagi o‘zgarishni taqqoslash.</p></div></div><div class="panel" style="margin-top:24px"><h2>Eng ustuvor yo‘nalishlar</h2>${rec.length?rec.map(r=>`<div class="public-priority"><b>${esc(r.title)}</b><span>${esc(r.test)}</span></div>`).join(''):'<p class="muted">Ustuvor jarayonlar rahbar bilan birga belgilanadi.</p>'}</div><div class="public-cta">Qaysi o‘zgarish sizning biznesingiz uchun birinchi o‘rinda?</div></section>`;
 return `<div class="present-wrap"><div class="present-toolbar no-print"><div class="present-brand"><span class="present-symbol">↗</span><strong>Biznes samaradorligi</strong><span>· ${esc(c.name||'Turagentlik')}</span></div><div class="present-controls"><button class="btn sm" onclick="printPublic()">⎙ PDF</button><button class="btn sm" onclick="setView('home')">✕ Taqdimotni yopish</button></div></div><div class="present-area">${slideOne}${slideTwo}${slideThree}${slideFour}</div><div class="present-pagination no-print"><button class="btn" onclick="setPresentSlide(${presentSlide-1})" ${presentSlide===0?'disabled':''}>← Oldingi</button><div class="slide-dots">${[0,1,2,3].map(i=>`<button aria-label="${i+1}-sahifa" class="${presentSlide===i?'active':''}" onclick="setPresentSlide(${i})"></button>`).join('')}</div><span>${presentSlide+1} / 4</span><button class="btn primary" onclick="setPresentSlide(${presentSlide+1})" ${presentSlide===3?'disabled':''}>Keyingi →</button></div></div>`;
}

function report(){const c=current(),o=info(),missing= !o.hasData;const p=problems(),pr=priorities(),answers=c.answers||{};const datestr=c.date||new Date().toISOString().slice(0,10);return header('Ichki audit xulosasi','Siz uchun batafsil javoblar va ishchi eslatmalar. Rahbarga ekran ulashishda taqdimot rejimidan foydalaning.',`<div class="no-print"><button class="btn primary" onclick="printPublic()">▣ Rahbar uchun PDF</button></div>`)+`<div class="report-hero"><div><div class="eyebrow" style="color:#73d6c4">Biznes diagnostika hisoboti</div><h2>${esc(c.name||'Turagentlik')}</h2><p>Rahbar: ${esc(c.manager||'Kiritilmagan')} · Sana: ${esc(datestr)} · SPIN savollar: ${statsAnswered()}/${questions.length}</p></div><span class="pill ${missing?'orange':''}">${missing?'Hisob uchun ma’lumot yetarli emas':'Ssenariy tayyor'}</span></div>
<div class="grid four stats">${stat('So‘rovlar / oy',o.leads?fmt(o.leads):'—','Jami murojaat')}${stat('Amaldagi sotuv',o.leads?fmt(o.sales):'—','Bir oyda yopilgan bronlar')}${stat('Javobsiz so‘rov',o.leads?fmt(o.missed,1):'—','Foiz hisobida','negative')}${stat('Amaldagi konversiya',o.leads?fmt(o.conversion*100,2)+'%':'—','Jami so‘rovga nisbatan')}</div>
${missing?`<div class="alert" style="margin-bottom:20px">Moliyaviy xulosa uchun kamida oylik so‘rovlar va bitta bronning foyda hissasini kiriting. Sotuvlar va boshqa parametrlar ham real ma’lumotlar asosida to‘ldirilishi kerak. <button class="btn sm" onclick="setView('calc')">Kalkulyatorni ochish</button></div>`:''}
<div class="grid two"><div class="panel"><h2 class="panel-title">01. Aniqlangan vaziyat va ehtiyoj</h2><div class="report-summary"><p><b>Rahbarning maqsadi:</b> ${esc(c.priority||'Hali qayd etilmagan.')}</p><p><b>Qo‘shimcha izoh:</b> ${esc(c.notes||'Kiritilmagan.')}</p><p><b>Muammolar soni:</b> ${p.length} ta rahbar bilan qayd etilgan.</p></div>${p.length?p.map(q=>`<div class="insight"><b>${esc(q.title)}</b>${answers[q.id]?.note?`<div style="color:#697489;margin-top:6px">Rahbar javobi: ${esc(answers[q.id].note)}</div>`:''}</div>`).join(''):'<div class="inline-note">Muammolar hali belgilab chiqilmagan. SPIN → Problem bosqichidan boshlang.</div>'}</div>
<div class="panel"><h2 class="panel-title">02. Tavsiya qilinadigan yo‘nalishlar</h2><p class="panel-sub">Bu CRM imkoniyati haqidagi qat'iy va'da emas, aniqlangan muammoga mos tekshirish rejasi.</p>${pr.map((r,i)=>`<div class="rec"><h4>${i+1}. ${esc(r.title)}</h4><p>${esc(r.why)}</p><em>30 kunlik sinov: ${esc(r.test)}</em></div>`).join('')}</div></div>
<div class="section-head"><h2>03. Moliyaviy imkoniyat ssenariysi</h2><span>Oylik, taxminiy</span></div><div class="grid four">${stat('Tiklangan lidlardan bron',o.hasData?fmt(o.recoveredSales,1):'—','Javobsiz guruh')}${stat('Follow-up dan bron',o.hasData?fmt(o.extraFollowups,1):'—','Ilgari kontaktdagi sotilmaganlar')}${stat('Qo‘shimcha foyda',o.hasData?money(o.grossProfit):'—','Oyiga, kafolat emas','positive')}${stat('CRMdan keyingi oylik foyda',o.hasData?money(o.netCash):'—','Faqat foyda hissasi − tarif','positive')}</div>
<div class="grid two" style="margin-top:17px"><div class="panel"><h2 class="panel-title">Pul oqimi ko‘rsatkichlari</h2><div class="breakdown"><div class="breakrow"><span>Potensial qo‘shimcha tushum</span><strong>${money(o.revenue)}</strong></div><div class="breakrow"><span>Qo‘shimcha foyda hissasi</span><strong>${money(o.grossProfit)}</strong></div><div class="breakrow"><span>Oylik CRM to‘lovi</span><strong>${money(o.fee)}</strong></div><div class="breakrow"><span>Joriy etish xarajati</span><strong>${money(o.setup)}</strong></div><div class="breakrow"><span>Birinchi oy hisobiy net natija</span><strong>${money(o.firstMonthNet)}</strong></div><div class="breakrow"><span>Oylik ROI</span><strong>${o.roi===null?'Tarif yo‘q':fmt(o.roi,1)+'%'}</strong></div><div class="breakrow"><span>Setup xarajati qoplanishi</span><strong>${o.setup===0?'Setup yo‘q':o.payback!==null?fmt(o.payback,1)+' oy':'Bu ssenariyda qoplanmaydi'}</strong></div></div></div><div class="panel"><h2 class="panel-title">Vaqt va ssenariy farazlari</h2><div class="breakdown"><div class="breakrow"><span>Javobsiz so‘rovlarning tiklanishi</span><strong>${fmt(pct(c.metrics.recoveryPct)*100,1)}%</strong></div><div class="breakrow"><span>Follow-up orqali qo‘shimcha sotuv</span><strong>${fmt(pct(c.metrics.followupPct)*100,1)}%</strong></div><div class="breakrow"><span>Mehnat vaqti qisqarishi</span><strong>${fmt(pct(c.metrics.timeSavingPct)*100,1)}%</strong></div><div class="breakrow"><span>Bo‘shashi mumkin bo‘lgan vaqt</span><strong>${fmt(o.workHours,1)} soat / oy</strong></div><div class="breakrow"><span>Vaqtning hisobiy qiymati</span><strong>${money(o.timeValue)}</strong></div></div><div class="formula">Vaqt qiymati naqd tejalish sifatida yoki ROI ichida hisoblanmadi. Barcha yaxshilanish foizlari suhbatdagi faraz bo‘lib, sinovda tekshirilishi kerak.</div></div></div>
<div class="panel" style="margin-top:17px"><h2 class="panel-title">04. Rahbar bilan kelishiladigan keyingi qadam</h2><div class="grid three"><div class="insight green"><b>1. Bazaviy nuqtani o‘lchash</b><div>7 kun: yangi so‘rov, javob tezligi, follow-up va bronlar.</div></div><div class="insight green"><b>2. Kichik sinov</b><div>30 kun: 1–2 menejer bilan jarayon va mos funksiyalarni sinash.</div></div><div class="insight green"><b>3. Natijani taqqoslash</b><div>Konversiya, qolib ketgan vazifalar va vaqt sarfini boshlang‘ich holat bilan solishtirish.</div></div></div><p style="font-size:13px;line-height:1.7;margin-bottom:0"><b>Uchrashuvni yakunlash uchun savol:</b> “Shu uchta ko‘rsatkichdan qaysi biri yaxshilansa, tizimni joriy qilishga asos bo‘ladi? Sinov natijasini qaysi sanada birga ko‘ramiz?”</p></div>
<div class="panel" style="margin-top:17px"><h2 class="panel-title">05. Rahbar profili va kirish bo‘yicha ichki qaydlar</h2><div class="grid two" style="font-size:13px;line-height:1.9"><div><b>Rahbar:</b> ${esc(c.manager||'—')}<br><b>Lavozim:</b> ${esc(c.title||'—')}<br><b>Telefon:</b> ${esc(c.contact||'—')}<br><b>Telegram:</b> ${esc(c.telegram||'—')}<br><b>Email:</b> ${esc(c.email||'—')}<br><b>Qaror roli:</b> ${esc(c.decisionRole||'—')}<br><b>Qarorga ta’sir qiluvchilar:</b> ${esc(c.decisionTeam||'—')}</div><div><b>Hudud:</b> ${esc(c.region||'—')}<br><b>Hozirgi vosita:</b> ${esc(c.currentTool||'—')}<br><b>Uchrashuv:</b> ${esc(c.meetingType||'—')} / ${esc(c.meetingStatus||'—')}<br><b>Rejalashtirilgan aloqa:</b> ${esc(c.nextDate||'—')}<br><b>Kirish checklist:</b> ${openingProgress()}/5<br><b>Keyingi harakat:</b> ${esc(c.nextStep||'—')}</div></div><div class="rule"></div><div><b>Rahbarning birinchi javobi:</b><p class="muted" style="white-space:pre-line">${esc(c.openingNotes||'Qayd yo‘q')}</p><b>Kelishilgan suhbat mavzusi:</b><p class="muted" style="white-space:pre-line">${esc(c.meetingAgenda||'Qayd yo‘q')}</p></div></div>
<div class="panel" style="margin-top:17px"><h2 class="panel-title">06. Suhbatdan olingan qo‘shimcha dalillar</h2>${phases.map(ph=>{const aa=questions.filter(q=>q.phase===ph.id && answers[q.id]&&(answers[q.id].note||answers[q.id].status));if(!aa.length)return '';return `<h3 style="font-size:13px;margin:16px 0 8px">${ph.name} — ${ph.uz}</h3>${aa.map(q=>`<div style="font-size:12px;line-height:1.7;border-bottom:1px dashed #e6eaf0;padding:9px 0"><b>${esc(q.title)}</b><div class="muted">${esc(answers[q.id]?.note||(['problem'].includes(answers[q.id]?.status)?'Muammo borligi belgilangan':'Holat qayd etilgan'))}</div></div>`).join('')}`}).join('')||'<p class="muted">Hali qayd yo‘q.</p>'}</div>
<div class="alert" style="margin-top:20px"><b>Hisob chegarasi:</b> Hisobotdagi qo‘shimcha sotuv va foyda kafolatlanmaydi. Bir sotuvning foyda hissasi haqiqiy xarajatlar bo‘yicha hisoblanishi lozim. CRM dasturi aynan qanday avtomatlashtirish va integratsiyalarni qo‘llashi joriy etishdan oldin tekshiriladi. Agar aniqlangan foizlar taxminiy bo‘lsa, mijozga ularni shunday ko‘rsating.</div><div class="actionsline no-print"><button class="btn" onclick="setView('spin')">← SPIN javoblari</button><button class="btn primary" onclick="printPublic()">▣ Taqdimot PDF</button></div>`}
function render(){
 if(!current()){clients=[makeClient()];activeId=clients[0].id}
 const names={home:'Bosh sahifa',opening:'Kirish va rahbar',spin:'Ichki suhbat',calc:'Kalkulyator',report:'Ichki hisobot',present:'Taqdimot'};
 document.body.classList.toggle('presenting',view==='present');
 document.getElementById('crumb').textContent=names[view];
 document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));
 document.getElementById('app').innerHTML=({home,opening,spin,calc,report,present}[view]||home)();bind();
}
function bind(){
 const app=document.getElementById('app');
 app.querySelectorAll('[data-client]').forEach(el=>el.addEventListener('input',e=>{current()[e.target.dataset.client]=e.target.value;save();if(e.target.dataset.client==='openingTone'){const focus=document.activeElement;render();return}if(e.target.dataset.client==='name'){const node=app.querySelector('.client-item.active button');if(node)node.childNodes[0].textContent=e.target.value||'Nomsiz agentlik'}}));
 app.querySelectorAll('[data-opening-check]').forEach(el=>el.addEventListener('change',e=>{const c=current();c.kickoff ||= {};c.kickoff[e.target.dataset.openingCheck]=e.target.checked;save();el.closest('.opening-check')?.classList.toggle('checked',e.target.checked);const count=openingProgress();const t=app.querySelector('#openingProgressText');if(t)t.textContent=count+'/5 bajarildi';const bar=app.querySelector('#openingProgressBar');if(bar)bar.style.width=(count*20)+'%'}));
 const copyIntro=app.querySelector('#copyOpening');if(copyIntro)copyIntro.addEventListener('click',()=>{const t=app.querySelector('.opening-quote')?.textContent||'';if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>{copyIntro.textContent='✓ Nusxalandi'}).catch(()=>window.prompt('Matnni nusxalash',t));else window.prompt('Matnni nusxalash',t)});
 app.querySelectorAll('[data-metric]').forEach(el=>{
  el.addEventListener('input',e=>{const m=current().metrics||(current().metrics=initialMetrics());m[e.target.dataset.metric]=e.target.value;save();const live=document.getElementById('liveCalc');if(live)live.innerHTML=calcLive()});
  // Rerender during blur cancels the next-step click; live result updates on input instead.

 });
 app.querySelectorAll('[data-answer-note]').forEach(el=>el.addEventListener('input',e=>{const id=e.target.dataset.answerNote;current().answers ||= {};current().answers[id] ||= {};current().answers[id].note=e.target.value;save()}));
 app.querySelectorAll('[data-answer-status]').forEach(el=>el.addEventListener('change',e=>{const id=e.target.dataset.answerStatus;current().answers ||= {};current().answers[id] ||= {};current().answers[id].status=e.target.value;save()}));
 app.querySelectorAll('[data-phase]').forEach(el=>el.addEventListener('click',()=>{view='spin';setPhase(el.dataset.phase)}));
 app.querySelectorAll('[data-switch]').forEach(el=>el.addEventListener('click',()=>{activeId=el.dataset.switch;save();render()}));
 app.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.delete;if(!confirm('Ushbu agentlik auditi butunlay o‘chirilsinmi?'))return;clients=clients.filter(x=>x.id!==id);if(activeId===id)activeId=clients[0].id;save();render()}));
 const nbtn=document.getElementById('newClient');if(nbtn)nbtn.onclick=()=>{const name=prompt('Yangi agentlik nomi:','Yangi turagentlik');if(name===null)return;const c=makeClient(name.trim()||'Yangi turagentlik');clients.unshift(c);activeId=c.id;save();render()};
 const importBtn=document.getElementById('importInput');if(importBtn)importBtn.addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>1000000)throw Error('Fayl 1 MB dan katta');const obj=JSON.parse(await f.text());if(!Array.isArray(obj.clients)||!obj.clients.length||obj.clients.length>300||!obj.clients.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string'))throw Error('JSON formati mos emas');if(!confirm('Hozirgi saqlangan agentliklar importdagilar bilan almashtirilsinmi?'))return;clients=obj.clients;activeId=clients.find(x=>x.id===obj.activeId)?.id||clients[0].id;save();render()}catch(err){alert('Import xatosi: '+err.message)}})
}
const demo={leads:600,sales:48,missPct:15,missedCount:90,ticket:8000000,profit:650000,recoveryPct:40,recoveryClosePct:8,followupPct:1.5,staff:5,hours:1.2,days:22,hourCost:45000,timeSavingPct:40,crmFee:1200000,setup:0};
function download(content,file,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function init(){
 load();save();try{if(sessionStorage.getItem('toursales-presenting')==='1')view='present'}catch(e){}
 document.querySelectorAll('#nav button').forEach(el=>el.onclick=()=>setView(el.dataset.view));
 document.getElementById('demoBtn').onclick=()=>{if(!confirm('Joriy agentlikdagi kalkulyator ko‘rsatkichlari namuna raqamlari bilan almashtirilsinmi?'))return;current().metrics={...demo};save();calcStep=0;setView('calc')};
 document.getElementById('exportBtn').onclick=()=>download(JSON.stringify({version:3,exportedAt:new Date().toISOString(),clients,activeId},null,2),'toursales-audit-backup.json','application/json;charset=utf-8');
 document.getElementById('printBtn').onclick=printPublic;
 document.getElementById('shareBtn').onclick=openPresentation;
 render();
}
init();
</script>
</body></html>
